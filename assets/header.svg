<style>
  .bar { fill:url(#acc); transform-box:fill-box; transform-origin:center; animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform:scaleY(.35); opacity:.55 } 50% { transform:scaleY(1); opacity:1 } }
  .edge { stroke:#3b4660; stroke-width:2; stroke-dasharray:6 6; animation:flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset:-12 } }
  .node { fill:#111827; stroke:#8b7cf6; stroke-width:2.5; animation:blink 1.75s ease-in-out infinite; }
  @keyframes blink { 0%,100% { fill:#111827 } 50% { fill:#8b7cf6 } }
  .cursor { animation:caret 1s steps(1) infinite; }
  @keyframes caret { 50% { opacity:0 } }
  @media (prefers-reduced-motion: reduce) { .bar,.edge,.node,.cursor { animation:none } }
</style>
