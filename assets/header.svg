  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f5a524"/><stop offset=".5" stop-color="#ef6b73"/><stop offset="1" stop-color="#8b7cf6"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1b2333" stroke-width="1"/></pattern>
